<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCRATCHPAD — Tactile Notepad</title>
<style>
:root{
  --shell:#d9d2c3;
  --shell-dark:#b9b0a0;
  --shell-edge:#8e8676;
  --paper:#f6f1e4;
  --ink:#2c2a26;
  --accent:#d95d39;
  --green:#5d7a4f;
  --shadow:0 22px 45px rgba(35,30,22,.22), 0 3px 0 rgba(255,255,255,.55) inset;
}
*{box-sizing:border-box}
body{not
  margin:0;min-height:100vh;display:grid;place-items:center;
  background:
    radial-gradient(1200px 700px at 50% 10%, #f4efe6 0%, #ded6c7 60%, #c9c0af 100%);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);
  padding:24px;
}
.pad{
  width:min(430px,100%);
  background:linear-gradient(160deg,var(--shell),var(--shell-dark));
  border:1px solid var(--shell-edge);
  border-radius:28px;
  padding:18px;
  bbox-shadow: rgba(50, 50, 93, 0.25) 0px 50px 100px -20px, rgba(0, 0, 0, 0.3) 0px 30px 60px -30px, rgba(10, 37, 64, 0.35) 0px -2px 6px 0px inset;
  position:relative;
  user-select:none;
}
.pad::after{
  content:"";position:absolute;inset:0;border-radius:28px;pointer-events:none;
  background:linear-gradient(120deg,rgba(255,255,255,.35),transparent 35%,transparent 70%,rgba(0,0,0,.08));
}
.brand{
  display:flex;justify-content:space-between;align-items:center;
  padding:2px 6px 12px;
}
.brand h1{margin:0;font-size:14px;letter-spacing:.22em;font-weight:800}
.led{width:10px;height:10px;border-radius:50%;background:#7d8b6a;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.led.on{background:#8fd06a;box-shadow:0 0 10px #8fd06a,inset 0 1px 2px rgba(0,0,0,.3)}
.screen{
  background:var(--paper);
  border-radius:14px;
  border:2px solid #a79e8c;
  box-shadow:inset 0 4px 14px rgba(70,60,45,.18), 0 2px 0 rgba(255,255,255,.5);
  padding:10px;
}
textarea{
  width:100%;height:250px;resize:none;border:0;background:transparent;outline:none;
  font:15px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);
  background-image:repeating-linear-gradient(to bottom,transparent 0 26px,rgba(90,75,55,.18) 26px 27px);
  background-attachment:local;
}
.controls{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;
}
button{
  appearance:none;border:0;cursor:pointer;border-radius:14px;
  padding:14px 8px;font:700 10px/1 ui-monospace,monospace;letter-spacing:.14em;
  color:#2f2b24;background:linear-gradient(180deg,#eee7d8,#cfc7b5);
  box-shadow:0 5px 0 #948b7a,0 8px 16px rgba(50,42,30,.18),inset 0 1px 0 rgba(255,255,255,.7);
  transition:transform .07s ease,box-shadow .07s ease,filter .12s ease;
}
button:hover{filter:brightness(1.04)}
button:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #948b7a,0 3px 8px rgba(50,42,30,.16),inset 0 2px 5px rgba(0,0,0,.16);
}
button.primary{background:linear-gradient(180deg,#e8734d,#c34a28);color:#fff7ee;box-shadow:0 5px 0 #8b3018,0 8px 16px rgba(90,35,15,.22),inset 0 1px 0 rgba(255,255,255,.35)}
button.primary:active{box-shadow:0 1px 0 #8b3018,0 3px 8px rgba(90,35,15,.2),inset 0 2px 5px rgba(0,0,0,.25)}
button.good{background:linear-gradient(180deg,#7c9a68,#55703f);color:#f4f8ee;box-shadow:0 5px 0 #3b4f2c,0 8px 16px rgba(35,50,25,.2),inset 0 1px 0 rgba(255,255,255,.3)}
button.good:active{box-shadow:0 1px 0 #3b4f2c,0 3px 8px rgba(35,50,25,.18),inset 0 2px 5px rgba(0,0,0,.25)}
.status{
  margin-top:12px;display:flex;justify-content:space-between;align-items:center;
  background:#2f2b24;color:#d8d0bd;border-radius:10px;padding:9px 12px;
  font-size:10px;letter-spacing:.16em;box-shadow:inset 0 3px 8px rgba(0,0,0,.45);
}
.saved{color:#a5e07c}
.cleared{color:#f0a184}
</style>
</head>
<body>
<main class="pad">
  <div class="brand">
    <h1>SCRATCHPAD</h1>
    <div id="led" class="led on" title="Power"></div>
  </div>

  <section class="screen">
    <textarea id="note" placeholder="Write something down..." spellcheck="false"></textarea>
  </section>

  <section class="controls">
    <button id="save" class="good">SAVE</button>
    <button id="clear">CLEAR</button>
    <button id="copy" class="primary">COPY</button>
  </section>

  <div class="status">
    <span id="message">READY</span>
    <span id="chars">0 CHARS</span>
  </div>
</main>

<script>
const note=document.getElementById('note'),message=document.getElementById('message'),
chars=document.getElementById('chars'),led=document.getElementById('led');
note.value=localStorage.getItem('scratchpad')||'';
const update=()=>{chars.textContent=`${note.value.length} CHARS`;};
update();
let timer;
const flash=(text,cls='')=>{
  message.textContent=text;message.className=cls;clearTimeout(timer);
  timer=setTimeout(()=>{message.textContent='READY';message.className='';},1600);
};
document.getElementById('save').onclick=()=>{
  localStorage.setItem('scratchpad',note.value);
  flash('SAVED','saved');
};
document.getElementById('clear').onclick=()=>{
  if(!note.value)return flash('EMPTY');
  note.value='';localStorage.removeItem('scratchpad');update();flash('CLEARED','cleared');
};
document.getElementById('copy').onclick=async()=>{
  try{await navigator.clipboard.writeText(note.value);flash('COPIED','saved');}
  catch{flash('COPY BLOCKED','cleared');}
};
note.addEventListener('input',()=>{update();localStorage.setItem('scratchpad',note.value);led.classList.add('on');});
</script>
</body>
</html>
